<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>World Map Explorer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
    background: #0b1320;
    color: white;
}

#map {
    height: 600px;
    border-radius: 15px;
}

.card {
    border-radius: 15px;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a href="index.html" class="navbar-brand">🌍 World Explorer</a>
    <a href="regions.html" class="btn btn-outline-light btn-sm">Regions</a>
</nav>

<div class="container mt-3">

<!-- SEARCH -->
<div class="row mb-3">
    <div class="col-md-8">
        <input id="searchInput" class="form-control" placeholder="Search country (e.g. Philippines)">
    </div>
    <div class="col-md-4">
        <button class="btn btn-primary w-100" onclick="searchCountry()">Search & Pin</button>
    </div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- INFO -->
<div class="card mt-3 p-3 text-dark">
    <h5 id="countryName">---</h5>
    <p id="countryInfo">Search a country to see details.</p>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([20, 0], 2);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let marker;

// SEARCH COUNTRY + PIN MAP
async function searchCountry() {

    const query = document.getElementById("searchInput").value;

    const res = await fetch(`https://restcountries.com/v3.1/name/${query}`);
    const data = await res.json();

    const country = data[0];

    const name = country.name.common;
    const lat = country.latlng[0];
    const lng = country.latlng[1];

    // REMOVE OLD MARKER
    if (marker) map.removeLayer(marker);

    marker = L.marker([lat, lng]).addTo(map)
        .bindPopup(name)
        .openPopup();

    map.setView([lat, lng], 4);

    document.getElementById("countryName").innerText = name;
    document.getElementById("countryInfo").innerText =
        `Capital: ${country.capital?.[0] || "N/A"} | Population: ${country.population.toLocaleString()} | Region: ${country.region}`;
}

</script>

</body>
</html>
