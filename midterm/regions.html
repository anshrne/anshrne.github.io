<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Region Explorer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: #111827;
    color: white;
}

.card {
    border-radius: 15px;
}
</style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">
    <a href="index.html" class="btn btn-outline-light btn-sm">Home</a>
    <span class="navbar-brand">Region Explorer</span>
</nav>

<div class="container mt-4">

<!-- FILTER -->
<div class="row mb-3">
    <div class="col-md-6">
        <select id="regionSelect" class="form-select" onchange="loadRegion()">
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="Africa">Africa</option>
            <option value="Americas">Americas</option>
            <option value="Oceania">Oceania</option>
        </select>
    </div>

    <div class="col-md-6">
        <button class="btn btn-warning w-100" onclick="sortPopulation()">Sort: Population (High → Low)</button>
    </div>
</div>

<!-- RESULTS -->
<div class="row" id="countryContainer"></div>

</div>

<script>

let countriesData = [];
let sorted = false;

// LOAD REGION
async function loadRegion() {

    const region = document.getElementById("regionSelect").value;

    const res = await fetch(`https://restcountries.com/v3.1/region/${region}`);
    countriesData = await res.json();

    sorted = false;
    displayCountries(countriesData);
}

// SORT POPULATION
function sortPopulation() {

    countriesData.sort((a, b) => b.population - a.population);
    sorted = true;

    displayCountries(countriesData);
}

// DISPLAY
function displayCountries(data) {

    const container = document.getElementById("countryContainer");
    container.innerHTML = "";

    data.forEach(c => {

        container.innerHTML += `
        <div class="col-md-4 mb-3">
            <div class="card text-dark p-3">
                <h5>${c.name.common}</h5>
                <p>Population: ${c.population.toLocaleString()}</p>
                <p>Capital: ${c.capital?.[0] || "N/A"}</p>
                <p>Region: ${c.region}</p>
            </div>
        </div>
        `;
    });
}

// INIT
loadRegion();

</script>

</body>
</html>
